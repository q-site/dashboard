<!doctype html>
<html lang="nl" data-theme="light" data-accent="olijf">
<head>
<meta charset="utf-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>
<title>Beheer · Persoonlijk Dashboard</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F4F4EF">
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Geist:wght@400..600&family=Geist+Mono:wght@300..500&display=swap"
>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* ===== KLEUREN: LICHT, OLIJF (STANDAARD) ===== */
:root {
    --white: #FFFFFF;
    --light: #F4F4EF;
    --border: #E4E3DC;
    --anthracite: #23262A;
    --muted: #66696D;
    --olive: #5C6B2A;
    --olive-dark: #46521D;
    --accent-text: #FFFFFF;
    --badge-bg: #EEF1E2;
    --badge-border: #D6DDBC;
    --danger: #B4382E;
    --warning: #96600F;
    --success: #2F7A45;
    --success-bg: #E7F3EA;
    --error-bg: #FBEAE8;
    --warning-bg: #FBF1DE;
    --hatch: rgba(35, 38, 42, 0.06);
    --shadow: 0 14px 34px -20px rgba(25, 28, 20, 0.35);
    --overlay: rgba(15, 16, 14, 0.45);
    --radius: 12px;
    --radius-btn: 8px;
    --font-body: 'Geist', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-display: 'Bricolage Grotesque', 'Geist', system-ui, sans-serif;
    --font-mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --ease: cubic-bezier(0.2, 0.75, 0.25, 1);
    color-scheme: light;
}

/* ===== ACCENTKLEUREN: LICHT ===== */
:root[data-accent="blauw"] {
    --olive: #2F5E9E;
    --olive-dark: #234A7E;
    --badge-bg: #E8EFF9;
    --badge-border: #C8D7EE;
}

:root[data-accent="terracotta"] {
    --olive: #A8502F;
    --olive-dark: #873E22;
    --badge-bg: #F8EAE3;
    --badge-border: #EBCDBF;
}

:root[data-accent="paars"] {
    --olive: #6A4C9C;
    --olive-dark: #533A7C;
    --badge-bg: #F0EBF8;
    --badge-border: #DACFEE;
}

:root[data-accent="teal"] {
    --olive: #1F7270;
    --olive-dark: #165856;
    --badge-bg: #E3F2F1;
    --badge-border: #C0E0DE;
}

:root[data-accent="bordeaux"] {
    --olive: #8C2F45;
    --olive-dark: #6E2336;
    --badge-bg: #F7E7EB;
    --badge-border: #E9C8D0;
}

/* ===== KLEUREN: DONKER ===== */
[data-theme="dark"] {
    --white: #1A1C1E;
    --light: #111213;
    --border: #2C2F32;
    --anthracite: #ECEDE8;
    --muted: #9EA19C;
    --olive: #A9BA6C;
    --olive-dark: #C3D18C;
    --accent-text: #15170F;
    --badge-bg: #232816;
    --badge-border: #3A4227;
    --danger: #F0857A;
    --warning: #E2A84A;
    --success: #6CC489;
    --success-bg: #16261B;
    --error-bg: #2E1A18;
    --warning-bg: #2C2312;
    --hatch: rgba(255, 255, 255, 0.05);
    --shadow: 0 16px 36px -18px rgba(0, 0, 0, 0.7);
    --overlay: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
}

/* ===== ACCENTKLEUREN: DONKER ===== */
[data-theme="dark"][data-accent="blauw"] {
    --olive: #8DB3EA;
    --olive-dark: #B3CDF2;
    --badge-bg: #17202E;
    --badge-border: #2A3A54;
}

[data-theme="dark"][data-accent="terracotta"] {
    --olive: #E79A7B;
    --olive-dark: #F0B9A2;
    --badge-bg: #2A1B14;
    --badge-border: #4A2E22;
}

[data-theme="dark"][data-accent="paars"] {
    --olive: #B9A0E6;
    --olive-dark: #D2C2F1;
    --badge-bg: #211A2E;
    --badge-border: #3B2E52;
}

[data-theme="dark"][data-accent="teal"] {
    --olive: #6FC7C2;
    --olive-dark: #9BDAD6;
    --badge-bg: #122624;
    --badge-border: #22433F;
}

[data-theme="dark"][data-accent="bordeaux"] {
    --olive: #E08A9E;
    --olive-dark: #ECB0BE;
    --badge-bg: #2A161C;
    --badge-border: #4A2632;
}

/* ===== BASIS ===== */
*,
*::before,
*::after {
    box-sizing: border-box;
}

[hidden] {
    display: none !important;
}

html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}

body {
    margin: 0;
    min-height: 100vh;
    background: var(--light);
    color: var(--anthracite);
    font-family: var(--font-body);
    font-size: 14.5px;
    line-height: 1.5;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
}

/* Tijdens het wisselen van thema lopen de kleuren vloeiend over. */
html.theme-anim *,
html.theme-anim *::before,
html.theme-anim *::after {
    transition:
        background-color 0.45s ease,
        border-color 0.45s ease,
        color 0.45s ease,
        fill 0.45s ease,
        stroke 0.45s ease !important;
}

a {
    color: inherit;
    text-decoration: none;
}

button,
input,
select,
textarea {
    font: inherit;
    color: inherit;
}

button {
    cursor: pointer;
}

button:disabled {
    cursor: default;
}

:focus-visible {
    outline: 2px solid var(--olive);
    outline-offset: 2px;
}

h1,
h2,
h3 {
    margin: 0;
}

.disp {
    font-family: var(--font-display);
    letter-spacing: -0.02em;
}

.mono {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
}

.muted {
    color: var(--muted);
}

.sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
}

.icon {
    width: 18px;
    height: 18px;
    flex: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.icon.fill {
    fill: currentColor;
    stroke: none;
}

/* ===== ANIMATIES ===== */
@keyframes rise {
    from {
        opacity: 0;
        transform: translateY(14px);
    }
    to {
        opacity: 1;
        transform: none;
    }
}

@keyframes pop {
    from {
        opacity: 0;
        transform: translateY(-6px) scale(0.97);
    }
    to {
        opacity: 1;
        transform: none;
    }
}

@keyframes fade {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

@keyframes sheet {
    from {
        opacity: 0;
        transform: translateY(18px) scale(0.98);
    }
    to {
        opacity: 1;
        transform: none;
    }
}

@keyframes grow {
    from {
        transform: scaleX(0);
    }
}

@keyframes grow-y {
    from {
        transform: scaleY(0);
    }
}

@keyframes ring {
    from {
        stroke-dashoffset: var(--c);
    }
}

@keyframes pulse {
    0% {
        box-shadow: 0 0 0 0 color-mix(in srgb, var(--danger) 55%, transparent);
    }
    100% {
        box-shadow: 0 0 0 10px transparent;
    }
}

@keyframes float {
    0%,
    100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-9px);
    }
}

@keyframes drift {
    0%,
    100% {
        transform: translate(0, 0) rotate(-2deg);
    }
    50% {
        transform: translate(6px, -7px) rotate(-1deg);
    }
}

@keyframes spot {
    0%,
    100% {
        box-shadow:
            0 0 0 2px var(--olive),
            0 0 0 9999px rgba(10, 12, 8, 0.62);
    }
    50% {
        box-shadow:
            0 0 0 6px color-mix(in srgb, var(--olive) 45%, transparent),
            0 0 0 9999px rgba(10, 12, 8, 0.62);
    }
}

@keyframes hl {
    0%,
    100% {
        stroke-opacity: 1;
    }
    50% {
        stroke-opacity: 0.25;
    }
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.rise {
    animation: rise 0.7s var(--ease) both;
    animation-delay: calc(var(--i, 0) * 60ms);
}

.pop {
    animation: pop 0.28s cubic-bezier(0.2, 0.8, 0.3, 1) both;
}

.bar-fill {
    transform-origin: left center;
    animation: grow 1.1s var(--ease) 0.25s both;
}

.col-fill {
    transform-origin: center bottom;
    animation: grow-y 1s var(--ease) both;
    animation-delay: calc(0.25s + var(--i, 0) * 60ms);
}

.ring-fill {
    animation: ring 1.5s var(--ease) 0.25s both;
}

.now-dot {
    animation: pulse 2.2s ease-out infinite;
}

.spin {
    animation: spin 0.8s linear infinite;
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation: none !important;
        transition: none !important;
    }
}

/* ===== KNOPPEN EN VELDEN ===== */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 40px;
    padding: 0 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius-btn);
    background: var(--white);
    color: var(--anthracite);
    font-size: 14px;
    font-weight: 550;
    white-space: nowrap;
    transition:
        background-color 0.2s ease,
        border-color 0.2s ease,
        color 0.2s ease,
        transform 0.12s ease;
}

.btn:hover {
    background: var(--light);
    border-color: var(--muted);
}

.btn:active {
    transform: scale(0.97);
}

.btn.primary {
    border-color: var(--olive);
    background: var(--olive);
    color: var(--accent-text);
    font-weight: 600;
}

.btn.primary:hover {
    border-color: var(--olive-dark);
    background: var(--olive-dark);
}

.btn.danger {
    color: var(--danger);
}

.btn.danger:hover {
    background: var(--error-bg);
}

.btn.small {
    min-height: 34px;
    padding: 0 12px;
    font-size: 13px;
}

.btn.block {
    width: 100%;
}

.icon-btn {
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    padding: 0;
    border: 0;
    border-radius: var(--radius-btn);
    background: transparent;
    color: var(--muted);
    transition:
        background-color 0.2s ease,
        color 0.2s ease;
}

.icon-btn:hover {
    background: var(--light);
    color: var(--anthracite);
}

.field {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.field > span {
    font-size: 13px;
    font-weight: 500;
}

.input {
    width: 100%;
    min-height: 42px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-btn);
    background: var(--white);
    font-size: 14.5px;
    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

textarea.input {
    padding: 10px 12px;
    line-height: 1.5;
    resize: vertical;
}

.input:focus {
    outline: none;
    border-color: var(--olive);
    box-shadow: 0 0 0 3px var(--badge-bg);
}

.seg {
    display: inline-grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    gap: 3px;
    padding: 3px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--white);
}

.seg button {
    min-height: 34px;
    padding: 0 14px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    font-size: 13.5px;
    font-weight: 600;
    transition:
        background-color 0.25s ease,
        color 0.25s ease;
}

.seg button[aria-selected="true"],
.seg button[aria-checked="true"] {
    background: var(--olive);
    color: var(--accent-text);
}

/* Schakelaar (aan/uit) */
.switch {
    position: relative;
    width: 40px;
    height: 24px;
    flex: none;
    padding: 0;
    border: 0;
    border-radius: 999px;
    background: var(--border);
    transition: background-color 0.25s ease;
}

.switch::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #FFFFFF;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    transition: transform 0.25s cubic-bezier(0.3, 0.7, 0.3, 1);
}

.switch[aria-checked="true"] {
    background: var(--olive);
}

.switch[aria-checked="true"]::after {
    transform: translateX(16px);
}

.chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--light);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
}

.chip.late {
    background: var(--error-bg);
    color: var(--danger);
}

.chip.today {
    background: var(--warning-bg);
    color: var(--warning);
}

.chip.soon {
    background: var(--badge-bg);
    color: var(--olive-dark);
}

.chip.good {
    background: var(--success-bg);
    color: var(--success);
}

/* ===== KAARTEN ===== */
.card {
    min-width: 0;
    padding: 20px 22px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--white);
    transition:
        box-shadow 0.3s ease,
        transform 0.3s ease,
        border-color 0.3s ease;
}

.card.lift:hover {
    box-shadow: var(--shadow);
    transform: translateY(-2px);
}

.card-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
}

.card-head h2 {
    font-family: var(--font-display);
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.015em;
}

.card-link {
    border: 0;
    padding: 0;
    background: none;
    color: var(--olive);
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
}

.card-link:hover {
    text-decoration: underline;
}

.empty {
    padding: 18px 4px 6px;
    color: var(--muted);
    font-size: 13.5px;
}

.empty strong {
    display: block;
    margin-bottom: 2px;
    color: var(--anthracite);
    font-weight: 600;
}

.row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 9px 8px;
    border-radius: 9px;
    transition: background-color 0.2s ease;
}

.row:hover {
    background: var(--light);
}

.list {
    margin: 0;
    padding: 0;
    list-style: none;
}

.track {
    height: 7px;
    overflow: hidden;
    border-radius: 999px;
    background: var(--light);
}

.track > div {
    height: 100%;
    border-radius: 999px;
    background: var(--olive);
}

.check {
    display: grid;
    place-items: center;
    width: 20px;
    height: 20px;
    flex: none;
    padding: 0;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--accent-text);
    transition:
        background-color 0.2s ease,
        border-color 0.2s ease,
        transform 0.15s ease;
}

.check:active {
    transform: scale(0.88);
}

.check[aria-checked="true"] {
    border-color: var(--olive);
    background: var(--olive);
}

.check .icon {
    width: 12px;
    height: 12px;
    stroke-width: 3.4;
    opacity: 0;
    transition: opacity 0.2s ease;
}

.check[aria-checked="true"] .icon {
    opacity: 1;
}


/* ===== GEDEELD MET DE APP ===== */
.msg {
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 13.5px;
}

.msg.error {
    background: var(--error-bg);
    color: var(--danger);
}

.msg.ok {
    background: var(--success-bg);
    color: var(--success);
}

.msg.info {
    background: var(--badge-bg);
    color: var(--olive-dark);
}

.pop-icon {
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    flex: none;
    border-radius: 8px;
}

.page-head {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 22px;
}

.eyebrow {
    color: var(--muted);
    font-size: 13px;
}

.page-head h1 {
    margin-top: 4px;
    font-family: var(--font-display);
    font-size: clamp(30px, 3.6vw, 42px);
    font-weight: 600;
    line-height: 1.05;
    letter-spacing: -0.02em;
}

.grow {
    flex: 1;
    min-width: 0;
}

.ellipsis {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.sub {
    color: var(--muted);
    font-size: 12.5px;
}

.avatar {
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    flex: none;
    border-radius: 50%;
    background: var(--light);
    font-size: 11.5px;
    font-weight: 600;
}

.avatar.me {
    background: var(--olive);
    color: var(--accent-text);
}

.skeleton {
    height: 14px;
    margin: 10px 0;
    border-radius: 6px;
    background: linear-gradient(90deg, var(--light), var(--border), var(--light));
    background-size: 200% 100%;
    animation: shimmer 1.4s linear infinite;
}

@keyframes shimmer {
    from {
        background-position: 200% 0;
    }
    to {
        background-position: -200% 0;
    }
}

.backdrop {
    position: fixed;
    inset: 0;
    z-index: 80;
    display: grid;
    place-items: center;
    padding: 16px;
    background: var(--overlay);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    animation: fade 0.25s ease both;
}

.dialog {
    position: relative;
    width: 100%;
    max-width: 460px;
    max-height: calc(100vh - 32px);
    overflow: auto;
    padding: 26px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--white);
    box-shadow: 0 40px 80px -40px rgba(0, 0, 0, 0.6);
    animation: sheet 0.35s cubic-bezier(0.2, 0.8, 0.3, 1) both;
}

.dialog .close {
    position: absolute;
    top: 12px;
    right: 12px;
}

.dialog h2 {
    margin-top: 12px;
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 600;
    line-height: 1.15;
}

.dialog p {
    margin: 8px 0 0;
    color: var(--muted);
}

.dialog ul {
    display: flex;
    flex-direction: column;
    gap: 9px;
    margin: 14px 0 0;
    padding: 0;
    list-style: none;
    font-size: 14px;
}

.dialog li {
    display: flex;
    gap: 10px;
}

.dialog li::before {
    content: '';
    width: 6px;
    height: 6px;
    flex: none;
    margin-top: 8px;
    border-radius: 50%;
    background: var(--olive);
}

.dialog-actions {
    display: flex;
    gap: 8px;
    margin-top: 22px;
}

.dialog-actions .btn {
    flex: 1;
    min-height: 46px;
}

.version-chip {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--badge-bg);
    color: var(--olive-dark);
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
}

.toast-stack {
    position: fixed;
    bottom: calc(18px + env(safe-area-inset-bottom));
    left: 50%;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    transform: translateX(-50%);
    pointer-events: none;
}

.toast {
    max-width: calc(100vw - 32px);
    padding: 10px 14px;
    border-radius: 10px;
    background: var(--anthracite);
    color: var(--white);
    box-shadow: 0 20px 40px -20px rgba(0, 0, 0, 0.5);
    font-size: 13.5px;
    animation: sheet 0.3s cubic-bezier(0.2, 0.8, 0.3, 1) both;
}

.toast.error {
    background: var(--danger);
    color: var(--white);
}

.add-form .grow {
    flex: 1 1 240px;
}

.pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    min-height: 34px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 999px;

    color: var(--anthracite);
    font-size: 13px;
    font-weight: 550;
    transition:

        color 0.2s ease,
        border-color 0.2s ease;

.pill[aria-pressed="true"],
.pill[aria-selected="true"] {
    border-color: var(--anthracite);
    background: var(--anthracite);
    color: var(--white);
}

.dialog form {

    flex-direction: column;
    gap: 14px;
    margin-top: 16px;
}

.dialog .two {
    display: flex;
    gap: 10px;
}

.dialog .two > * {
    flex: 1;
    min-width: 0;
}

.dialog-foot {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 8px;
    margin-top: 8px;
}

.dialog-foot .right {
    display: flex;
    gap: 8px;
    margin-left: auto;
}

.form-error {
    padding: 8px 10px;
    border-radius: 8px;
    background: var(--error-bg);
    color: var(--danger);
    font-size: 13px;
}

.switch-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0;
    border: 0;
    background: transparent;
    text-align: left;
}

.req-row .grow {
    min-width: 120px;
}

.avatar.big {
    width: 38px;
    height: 38px;
    background: var(--badge-bg);
    color: var(--olive-dark);
    font-size: 12.5px;
}

.avatar.muted-av {
    background: var(--light);
    color: var(--muted);

.push-box .grow {
    min-width: 200px;

.adm-top {
    position: sticky;
    top: 0;
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 64px;
    padding: 10px clamp(16px, 3vw, 28px);
    padding-top: calc(10px + env(safe-area-inset-top));
    border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--white) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(12px);
    -webkit-backdrop-filter: saturate(1.4) blur(12px);
}

.adm-mark {
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    flex: none;
    border-radius: 8px;
    background: var(--anthracite);
    color: var(--white);
}

.adm-name {
    font-size: 16px;
    font-weight: 600;
}

.adm-chip {
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--badge-bg);
    color: var(--olive-dark);
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
}

.adm-user {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    margin-left: auto;
}

.adm-email {
    min-width: 0;
    overflow: hidden;
    color: var(--muted);
    font-size: 13px;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.adm-main {
    max-width: 1260px;
    margin: 0 auto;
    padding: 28px clamp(16px, 3vw, 40px) 56px;
}

.adm-head {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
}

.adm-head h1 {
    font-size: clamp(30px, 3.6vw, 42px);
    font-weight: 600;
    line-height: 1.05;
}

.adm-tabs {
    max-width: 100%;
    overflow-x: auto;
}

.adm-grid {
    display: grid;
    grid-template-columns: minmax(200px, 240px) minmax(0, 1fr) minmax(260px, 340px);
    align-items: start;
    gap: 20px;
}

.upd-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px;
}

.upd-item {
    display: block;
    width: 100%;
    padding: 10px 12px;
    border: 1px solid transparent;
    border-radius: 9px;

.upd-item:hover {

}

.upd-item[aria-current="true"] {

}

.upd-status {
    padding: 1px 7px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
}

.upd-status.live {
    background: var(--success-bg);
    color: var(--success);
}

.upd-status.draft {
    background: var(--warning-bg);
    color: var(--warning);
}

.upd-form {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.upd-form textarea {
    min-height: 200px;

    line-height: 1.55;
}

.warn-box {
    display: flex;
    gap: 10px;
    padding: 12px 14px;
    border-radius: 9px;
    background: var(--warning-bg);
    color: var(--warning);
    font-size: 13.5px;
    transition:
        box-shadow 0.25s ease,
        transform 0.25s ease;
}

.warn-box.loud {
    box-shadow: 0 0 0 2px var(--warning);
    transform: translateY(-1px);
}

.form-foot {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
}

.form-foot .right {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-left: auto;
}

.save-note {
    color: var(--success);
    font-size: 13px;
}

.preview-label {
    margin: 6px 0 10px;
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
}

.preview-stage {
    padding: 24px;
    border-radius: 14px;
    background: color-mix(in srgb, var(--anthracite) 72%, transparent);
}

.preview-stage .dialog {
    max-width: none;
    animation: none;
}

.sug-row {

    flex-wrap: wrap;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 6px;
    border-top: 1px solid var(--border);
}

.sug-row .grow {
    flex: 1 1 200px;
    min-width: 0;
    overflow-wrap: anywhere;
}

.sug-row > .btn {
    margin-left: auto;
}

.sug-row:first-child {
    border-top: 0;
}

.sug-text {
    margin-top: 2px;
    font-size: 14.5px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.stat-tiles {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 14px;
}

.stat-tile .big {
    margin-top: 4px;

    font-size: 38px;
    font-weight: 600;

}

.key-out {

}

.key-out .input {

.adm-note {

    font-size: 12.5px;
}

.center-card {
    max-width: 420px;
    margin: 8vh auto 0;
}

@media (max-width: 1080px) {
    .adm-grid {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);

    }

    .upd-list {
        flex-direction: row;
        overflow-x: auto;
    }

    .upd-item {
        width: auto;

    }

        grid-template-columns: minmax(0, 1fr);

    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');

    svg.setAttribute('class', 'icon');
    svg.setAttribute('aria-hidden', 'true');
    svg.style.width = (size || 18) + 'px';
    svg.style.height = (size || 18) + 'px';
    use.setAttribute('href', '#i-' + name);
    svg.append(use);

    return svg;
}

function $(selector) {
    return document.querySelector(selector);
}

function toast(text, kind) {
    const node = h('div', { class: 'toast' + (kind === 'error' ? ' error' : ''), role: kind === 'error' ? 'alert' : 'status', text: text });

    $('#toasts').append(node);

    setTimeout(() => {
        node.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
        node.style.opacity = '0';
        node.style.transform = 'translateY(8px)';
        setTimeout(() => node.remove(), 320);
    }, kind === 'error' ? 5000 : 2600);
}

function initials(name) {
    const parts = String(name || '')
        .split(/\s+/)
        .map((word) => word.replace(/[^\p{L}\p{N}]/gu, ''))
        .filter(Boolean);

    if (!parts.length) {
        return '?';
    }

    return (Array.from(parts[0])[0] + (parts[1] ? Array.from(parts[1])[0] : '')).toUpperCase();
}

function niceWhen(iso) {
    const d = new Date(iso);

    return d.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short', year: 'numeric' }) + ', ' + d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
}

// Knop die pas bij een tweede klik iets doet.
function confirmButton(label, onConfirm, confirmLabel, className) {
    const button = h('button', { class: className || 'btn danger', type: 'button', text: label });
    let armed = false;
    let timer = null;

    button.addEventListener('click', async () => {
        if (!armed) {
            armed = true;
            button.textContent = confirmLabel || 'Zeker weten?';
            timer = setTimeout(() => {
                armed = false;
                button.textContent = label;
            }, 4000);
            return;
        }

        clearTimeout(timer);
        button.disabled = true;
        await onConfirm();
        button.disabled = false;
        armed = false;
        button.textContent = label;
    });

    return button;
}

function switchRow(label, help, on, onChange) {
    const knob = h('span', { class: 'switch', 'aria-hidden': 'true', 'aria-checked': String(!!on) });
    const button = h(
        'button',
        { class: 'switch-row', type: 'button', role: 'switch', 'aria-checked': String(!!on), style: { alignItems: 'flex-start', textAlign: 'left' } },
        knob,
        h('span', null, h('span', { style: { display: 'block', fontSize: '14px', fontWeight: '600' }, text: label }), help ? h('span', { class: 'sub', style: { display: 'block', fontSize: '12.5px' }, text: help }) : null)
    );

    button.addEventListener('click', () => {
        const next = button.getAttribute('aria-checked') !== 'true';

        button.setAttribute('aria-checked', String(next));
        knob.setAttribute('aria-checked', String(next));
        onChange(next);
    });

    return button;
}

function field(label, control, hint) {
    return h(

        { class: 'field' },

}


/* ===== VERSIES ===== */
function compareVersions(a, b) {
    const pa = String(a || '0').split('.').map(Number);
    const pb = String(b || '0').split('.').map(Number);

    for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
        const diff = (pa[i] || 0) - (pb[i] || 0);

        if (diff) {
            return diff;
        }
    }

    return 0;
}

function nextVersion() {
    const top = state.updates.map((u) => u.version).sort(compareVersions).pop();

    if (!top) {
        return '1.0';
    }

    const parts = top.split('.').map(Number);

    return parts[0] + '.' + ((parts[1] || 0) + 1);
}


/* ===== UPDATEMELDING ALS VOORBEELD ===== */
// Zelfde opmaak als in de app: regels met "- " worden een lijst.
function updateBody(text) {
    const nodes = [];
    let list = null;

    for (const line of String(text || '').split('\n')) {
        if (line.startsWith('- ')) {
            if (!list) {
                list = h('ul');
                nodes.push(list);
            }

            list.append(h('li', null, h('span', { text: line.slice(2) })));
        } else if (line.trim()) {
            list = null;
            nodes.push(h('p', { text: line }));
        }
    }

    return nodes;
}

/* ===== UPDATEMELDINGEN ===== */
async function loadUpdates() {
    const { data, error } = await db.from('app_updates').select('id, version, title, body, published, published_at, created_at').order('created_at', { ascending: false });

    if (error) {
        toast('Meldingen laden lukte niet.', 'error');
        return;
    }

    state.updates = (data || []).sort((a, b) => compareVersions(b.version, a.version));

    if (!state.draft) {
        const first = state.updates[0];

        if (first) {
            selectUpdate(first.id);
            return;
        }

        newDraft();
        return;
    }

    if (state.tab === 'meldingen') {
        render();
    }
}

function selectUpdate(id) {
    const u = state.updates.find((x) => x.id === id);

    if (!u) {
        return;
    }

    state.currentId = id;
    state.draft = { version: u.version, title: u.title, body: u.body || '', published: !!u.published };
    state.saved = false;
    render();
}

function newDraft() {
    state.currentId = null;
    state.draft = { version: nextVersion(), title: '', body: '', published: false };
    state.saved = false;
    render();
}

function renderUpdates() {
    const d = state.draft || { version: '', title: '', body: '', published: false };
    const original = state.updates.find((u) => u.id === state.currentId) || null;

    // ----- Lijst -----
    const list = h(
        'section',
        { class: 'card upd-side rise', style: { padding: '0', '--i': '1' } },
        h(
            'div',
            { class: 'upd-list' },
            h('button', { class: 'btn primary block', type: 'button', onclick: newDraft }, icon('plus', 15), 'Nieuwe melding'),
            state.updates.map((u) =>
                h(
                    'button',
                    { class: 'upd-item', type: 'button', 'aria-current': String(u.id === state.currentId), onclick: () => selectUpdate(u.id) },
                    h(
                        'span',
                        { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: '8px' } },
                        h('span', { class: 'mono', style: { fontWeight: '600', fontSize: '13.5px' }, text: 'v' + u.version }),
                        h('span', { class: 'upd-status ' + (u.published ? 'live' : 'draft'), text: u.published ? 'Gepubliceerd' : 'Concept' })
                    ),
                    h('span', { class: 'ellipsis', style: { display: 'block', marginTop: '3px', fontSize: '13.5px' }, text: u.title })
                )
            )
        )
    );

    // ----- Formulier -----
    const version = h('input', { class: 'input mono', id: 'upd-version', value: d.version, maxlength: '12', inputmode: 'decimal', autocomplete: 'off' });
    const title = h('input', { class: 'input', id: 'upd-title', value: d.title, maxlength: '120', autocomplete: 'off' });
    const body = h('textarea', { class: 'input', id: 'upd-body', maxlength: '5000' });
    const error = h('div', { class: 'form-error', role: 'alert', hidden: true });
    const note = h('span', { class: 'save-note', role: 'status', text: state.saved ? 'Opgeslagen' : '' });

    body.value = d.body;

    const warn = h(
        'div',
        { class: 'warn-box', id: 'upd-warn' },
        icon('warning', 17),
        h('span', { text: 'Pas je een melding aan zonder het versienummer te verhogen, dan zien gebruikers die hem al gezien hebben hem niet opnieuw.' })
    );

    const refreshWarn = () => {
        const changedText = original && original.published && version.value.trim() === original.version && (title.value !== original.title || body.value !== (original.body || ''));

        warn.classList.toggle('loud', !!changedText);
    };

    const preview = h('div', { class: 'dialog', role: 'img', 'aria-label': 'Voorbeeld van de melding' });

    const drawPreview = () => {
        put(
            preview,
            h('span', { class: 'version-chip', text: 'Nieuw in versie ' + (version.value.trim() || '?') }),
            h('h2', { text: title.value.trim() || 'Titel van de melding' }),
            updateBody(body.value),
            h('div', { class: 'dialog-actions' }, h('button', { class: 'btn primary', type: 'button', tabindex: '-1', text: 'Begrepen' }))
        );
    };

    for (const input of [version, title, body]) {
        input.addEventListener('input', () => {
            d.version = version.value;
            d.title = title.value;
            d.body = body.value;
            note.textContent = '';
            drawPreview();
            refreshWarn();
        });
    }

    const published = switchRow('Gepubliceerd', 'Gebruikers zien de nieuwste gepubliceerde melding één keer.', d.published, (on) => {
        d.published = on;
    });

    const form = h(
        'form',
        { class: 'card upd-form rise', style: { '--i': '2' }, novalidate: true },
        h('div', { style: { display: 'grid', gridTemplateColumns: 'minmax(90px, 120px) minmax(0, 1fr)', gap: '10px' } }, field('Versie', version), field('Titel', title)),
        field('Tekst', body, 'regels die met "- " beginnen worden een lijst'),
        published,
        warn,
        error,
        h(
            'div',
            { class: 'form-foot' },
            state.currentId
                ? confirmButton('Verwijderen', deleteUpdate, 'Echt verwijderen?')
                : null,
            h('div', { class: 'right' }, note, h('button', { class: 'btn primary', type: 'submit', text: 'Opslaan' }))
        )
    );

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        error.hidden = true;

        const v = version.value.trim();
        const t = title.value.trim();

        if (!VERSION_PATTERN.test(v)) {
            error.hidden = false;
            error.textContent = 'Een versie ziet eruit als 1.2 of 1.2.3.';
            return;
        }

        if (!t) {
            error.hidden = false;
            error.textContent = 'Geef de melding een titel.';
            return;
        }

        if (state.updates.some((u) => u.version === v && u.id !== state.currentId)) {
            error.hidden = false;
            error.textContent = 'Versie ' + v + ' bestaat al.';
            return;
        }

        const row = {
            version: v,
            title: t.slice(0, 120),
            body: body.value.slice(0, 5000),
            published: d.published,
            published_at: d.published ? (original && original.published && original.published_at ? original.published_at : new Date().toISOString()) : null
        };

        const result = state.currentId
            ? await db.from('app_updates').update(row).eq('id', state.currentId).select('id').single()
            : await db.from('app_updates').insert(row).select('id').single();

        if (result.error) {
            error.hidden = false;
            error.textContent = 'Opslaan lukte niet: ' + result.error.message;
            return;
        }

        state.currentId = result.data.id;
        state.saved = true;
        await loadUpdates();
        selectUpdate(state.currentId);
        state.saved = true;
        render();
        toast(d.published ? 'Opgeslagen en gepubliceerd.' : 'Opgeslagen als concept.');
    });

    drawPreview();
    refreshWarn();

    return h(
        'div',
        { class: 'adm-grid' },
        list,
        form,
        h('aside', { class: 'rise', style: { '--i': '3' } }, h('div', { class: 'preview-label', text: 'Voorbeeld' }), h('div', { class: 'preview-stage' }, preview))
    );
}

    }

    toast('Melding verwijderd.');

/* ===== PUSHSLEUTELS (VAPID) ===== */
// Maakt een sleutelpaar in deze browser. De geheime sleutel wordt
// nergens opgeslagen of verstuurd: je kopieert hem zelf naar de
// geheimen van de Edge Function.
function b64url(bytes) {
    let text = '';

    for (const b of new Uint8Array(bytes)) {
        text += String.fromCharCode(b);
    }

    return btoa(text).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

async function generateKeys() {
    const pair = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign', 'verify']);
    const publicRaw = await crypto.subtle.exportKey('raw', pair.publicKey);
    const privateJwk = await crypto.subtle.exportKey('jwk', pair.privateKey);

    state.keys = { publicKey: b64url(publicRaw), privateKey: privateJwk.d };
    render();
}

function keyOutput(label, value, help) {
    const input = h('input', { class: 'input', readonly: true, value: value, 'aria-label': label, spellcheck: 'false' });

    return h(
        'div',
        { style: { marginTop: '16px' } },
        h('div', { style: { fontSize: '14px', fontWeight: '600' }, text: label }),
        h('div', { class: 'sub', style: { fontSize: '12.5px' }, text: help }),
        h(
            'div',
            { class: 'key-out' },
            input,
            h('button', {
                class: 'btn',
                type: 'button',
                text: 'Kopiëren',
                onclick: async (event) => {
                    const button = event.currentTarget;

                    try {
                        await navigator.clipboard.writeText(value);
                        button.textContent = 'Gekopieerd';
                        setTimeout(() => {
                            button.textContent = 'Kopiëren';
                        }, 1800);
                    } catch (err) {
                        input.select();
                        toast('Kopieer de sleutel zelf met Ctrl+C.');
                    }
                }
            })
        )
    );
}

function renderKeys() {
    const k = state.keys;

    return h(
        'section',
        { class: 'card rise', style: { maxWidth: '760px', '--i': '1' } },
        h('h2', { class: 'disp', style: { fontSize: '19px', fontWeight: '600' }, text: 'Sleutels voor pushmeldingen' }),
        h('p', { class: 'sub', style: { margin: '6px 0 0' }, text: 'Pushmeldingen hebben één sleutelpaar nodig (VAPID). Maak het één keer aan. Een nieuw paar maken betekent dat iedereen pushmeldingen opnieuw moet aanzetten.' }),
        h('button', { class: 'btn primary', type: 'button', style: { marginTop: '16px' }, onclick: generateKeys }, icon('refresh', 15), k ? 'Nog een paar maken' : 'Sleutelpaar maken'),
        k
            ? h(
                'div',
                { class: 'pop' },
                keyOutput('Publieke sleutel', k.publicKey, 'In index.html bij VAPID_PUBLIC_KEY, en als geheim VAPID_PUBLIC_KEY bij de Edge Function. Deze mag openbaar zijn.'),
                keyOutput('Geheime sleutel', k.privateKey, 'Alleen als geheim VAPID_PRIVATE_KEY bij de Edge Function. Nooit in een bestand op GitHub zetten.'),
                h('div', { class: 'warn-box', style: { marginTop: '16px' } }, icon('warning', 17), h('span', { text: 'De geheime sleutel wordt nergens bewaard. Sluit je deze pagina, dan is hij weg. Kopieer hem dus nu.' }))
            )
            : null
    );
}


/* ===== OPSTARTEN ===== */
async function start() {
    if (!db) {
        showMessage('Nog niet ingesteld', 'Vul bovenin dit bestand SUPABASE_URL en SUPABASE_KEY in, net als in index.html.');
        return;
    }

    const { data } = await db.auth.getSession();
    const session = data && data.session;

    if (!session) {
        showLogin();
        return;
    }

    state.user = session.user;
    $('#adm-user').hidden = false;
    $('#adm-email').textContent = 'Ingelogd als ' + (session.user.email || '');

    // De database beslist. Ook als iemand deze controle in de
    // browser omzeilt, geven de policies hem niets terug.
    const { data: isAdmin, error } = await db.rpc('is_admin');

    applyTheme();

    if (error || isAdmin !== true) {
        showNoAccess();
        return;
    }

    render();
    loadTab();
}

$('#adm-logout').addEventListener('click', async () => {
    await db.auth.signOut();
    state.user = null;
    state.draft = null;
    showLogin();
});

start();
</script>
</body>
</html>
